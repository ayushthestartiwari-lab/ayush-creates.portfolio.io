<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be Ahead — AI Interview</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="interview.css" />
</head>
<body>

<div class="interview-shell">

  <!-- Top bar -->
  <header class="interview-topbar">
    <a href="index.html" class="interview-logo">be_ahead<span class="cursor-blink">_</span></a>
    <div class="interview-status" id="statusPill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">idle</span>
    </div>
  </header>

  <!-- Setup screen -->
  <section class="panel setup-panel" id="setupPanel">
    <p class="term-line"># be_ahead / mock_interview_v1</p>
    <p class="term-line">&gt;&gt;&gt; select a track and I will run a short spoken interview.</p>
    <p class="term-line">&gt;&gt;&gt; camera + mic access required. nothing is uploaded — video never leaves your browser.</p>

    <div class="setup-row">
      <label for="topicSelect" class="term-label"># topic</label>
      <select id="topicSelect" class="term-select">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="general">General / Behavioral</option>
      </select>
    </div>

    <button class="term-btn" id="startBtn">&gt;&gt;&gt; start_interview()</button>
    <p class="term-line error-line" id="permError" hidden></p>
  </section>

  <!-- Live interview screen -->
  <section class="panel interview-panel" id="interviewPanel" hidden>

    <div class="interview-grid">

      <div class="video-col">
        <video id="camPreview" autoplay muted playsinline></video>
        <canvas id="faceCanvas"></canvas>
        <div class="video-meta">
          <span id="questionCounter">Q 1 / 5</span>
          <span id="timer">00:00</span>
        </div>
      </div>

      <div class="transcript-col">
        <div class="transcript-log" id="transcriptLog"></div>

        <div class="mic-row">
          <div class="mic-indicator" id="micIndicator">
            <span class="mic-dot"></span>
            <span id="micState">waiting for question</span>
          </div>
          <button class="term-btn-small" id="endBtn">&gt;&gt;&gt; end_interview()</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Report screen -->
  <section class="panel report-panel" id="reportPanel" hidden>
    <p class="term-line"># interview_report.json</p>
    <div id="reportBody" class="report-body">
      <p class="term-line">&gt;&gt;&gt; generating report...</p>
    </div>
    <button class="term-btn" id="restartBtn">&gt;&gt;&gt; new_interview()</button>
  </section>

</div>

<script src="interview.js"></script>
</body>
</html>
