<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Enhancer — Be Ahead</title>
<meta name="description" content="Turn rough prompts into clear, effective ones — instantly, powered by AI.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Geometric background -->
<canvas class="geo-bg-canvas" aria-hidden="true"></canvas>

<!-- Header -->
<header>
  <img src="logo.jpg" alt="Be Ahead Logo" class="logo-overlay">
  <h1 class="site-title">Be Ahead.</h1>
  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Sign In / Sign Up</a>
  </nav>
</header>

<!-- Prompt Enhancer Tool -->
<section class="enhancer-page">
  <h1>Prompt Enhancer</h1>
  <p class="quote">
    Paste a rough prompt below and get back a clearer, more effective version.
  </p>

  <div class="enhancer-box">
    <textarea id="enhancer-input" placeholder="e.g. write me a blog post about dogs" rows="5"></textarea>
    <button id="enhancer-btn">Enhance Prompt →</button>

    <div id="enhancer-output" class="enhancer-output" hidden>
      <div class="enhancer-output-header">
        <span>Enhanced Prompt</span>
        <button id="enhancer-copy">Copy</button>
      </div>
      <p id="enhancer-result"></p>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p>For any queries, please mail us at:
    <a href="mailto:kumartiwariayush19@gmail.com">kumartiwariayush19@gmail.com</a>
  </p>
  <p><a href="home.html" class="footer-link">Back to Home</a></p>
  &copy; 2026 Be Ahead <br>
  Developed by <strong>Ayush Tiwary</strong>
</footer>

<script src="geo-network.js" defer></script>
<script src="prompt-enhancer.js"></script>
</body>
</html>
